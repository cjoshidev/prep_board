<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Prep Tracker — 6 Month Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #141416;
  --surface2: #1a1a1e;
  --surface3: #202026;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8e6e0;
  --muted: #7a7870;
  --muted2: #5a5856;
  --accent: #c8f060;
  --accent2: #a8d848;
  --purple: #9d7fff;
  --teal: #40e0b0;
  --amber: #f0b840;
  --coral: #ff7060;
  --blue: #60a0f8;
  --font-display: 'Fraunces', serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* LAYOUT */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
}
.main { margin-left: 260px; flex: 1; min-height: 100vh; }

/* SIDEBAR */
.sidebar-logo {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.logo-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.2;
}
.logo-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
}

.sidebar-stats {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
.stat-item { text-align: center; }
.stat-n { font-family: var(--font-mono); font-size: 20px; font-weight: 500; color: var(--accent); }
.stat-l { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }

.overall-bar { margin-top: 8px; }
.bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
.bar-track { background: var(--surface3); border-radius: 3px; height: 5px; overflow: hidden; }
.bar-fill { height: 5px; background: var(--accent); border-radius: 3px; transition: width 0.4s; }

.sidebar-nav { padding: 12px 12px; flex: 1; }
.nav-phase-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--muted2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 8px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(200,240,96,0.1); color: var(--accent); }
.nav-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid currentColor;
}
.nav-item.active .nav-dot { background: var(--accent); border-color: var(--accent); }
.nav-pct {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted2);
}
.nav-item.active .nav-pct { color: var(--accent); }

/* MAIN CONTENT */
.header {
  padding: 32px 40px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.header-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 300;
  color: var(--text);
  line-height: 1.2;
}
.header-title span { color: var(--accent); font-style: italic; }
.header-meta { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }
.phase-badge-lg {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 500;
  flex-shrink: 0;
}
.header-tabs {
  display: flex; gap: 4px; margin-top: 20px;
}
.htab {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  color: var(--muted);
  background: transparent;
  border: none;
  font-family: var(--font-body);
  transition: all 0.15s;
}
.htab:hover { color: var(--text); background: var(--surface2); }
.htab.active { background: var(--surface3); color: var(--text); }

.content { padding: 28px 40px; }

/* WEEK CARDS */
.week-section { margin-bottom: 28px; }
.week-heading {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
}
.week-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.week-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.week-line { flex: 1; height: 1px; background: var(--border); }
.week-prog { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
}
.day-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.day-card.today { border-color: rgba(200,240,96,0.3); }

.day-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 10px;
  cursor: pointer;
}
.day-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--surface3);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.day-label.today-label { background: rgba(200,240,96,0.15); color: var(--accent); }
.day-topic { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
.day-expand { font-size: 11px; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.day-expand.open { transform: rotate(90deg); display: inline-block; }

.day-card-body { padding: 0 14px 12px; display: none; }
.day-card-body.open { display: block; }

.prob-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.prob-item:last-child { border-bottom: none; }

.checkbox {
  width: 17px; height: 17px; border-radius: 4px;
  border: 1.5px solid var(--border2);
  background: transparent;
  cursor: pointer; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.checkbox:hover { border-color: var(--accent); }
.checkbox.checked { background: var(--accent); border-color: var(--accent); }
.checkbox.checked::after {
  content: '';
  width: 9px; height: 5px;
  border-left: 2px solid #0d0d0f;
  border-bottom: 2px solid #0d0d0f;
  transform: rotate(-45deg) translate(0.5px, -1px);
  display: block;
}

.prob-details { flex: 1; min-width: 0; }
.prob-name { font-size: 13px; color: var(--text); font-weight: 400; }
.prob-name.checked-text { color: var(--muted2); text-decoration: line-through; }
.prob-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }

.diff {
  font-size: 10px; font-weight: 500; font-family: var(--font-mono);
  padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
}
.diff-easy { background: rgba(64,224,176,0.12); color: var(--teal); }
.diff-medium { background: rgba(240,184,64,0.12); color: var(--amber); }
.diff-hard { background: rgba(255,112,96,0.12); color: var(--coral); }
.diff-theory { background: rgba(157,127,255,0.12); color: var(--purple); }
.diff-mock { background: rgba(96,160,248,0.12); color: var(--blue); }

.day-note {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: 6px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
  border-left: 2px solid var(--surface3);
}

.day-mini-bar { padding: 8px 14px 2px; }
.mini-track { height: 3px; background: var(--surface3); border-radius: 2px; }
.mini-fill { height: 3px; border-radius: 2px; background: var(--accent); transition: width 0.3s; }

/* PHASE OVERVIEW */
.phase-overview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.phase-stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.psc-label { font-size: 11px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }
.psc-val { font-family: var(--font-mono); font-size: 24px; font-weight: 500; color: var(--accent); margin-top: 4px; }
.psc-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* TIPS PANEL */
.tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.tip-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.tip-card-title { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 8px; font-family: var(--font-mono); }
.tip-list { list-style: none; }
.tip-list li {
  font-size: 12px; color: var(--muted);
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px;
}
.tip-list li:last-child { border-bottom: none; }
.tip-list li::before { content: '—'; color: var(--muted2); flex-shrink: 0; }

/* TABS PANEL */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* PHASE COLORS */
.ph1 { color: #9d7fff; }
.ph2 { color: #40e0b0; }
.ph3 { color: #f0b840; }
.ph4 { color: #ff7060; }
.ph5 { color: #60a0f8; }
.ph6 { color: #c8f060; }

.phase-dot-1 { background: #9d7fff; }
.phase-dot-2 { background: #40e0b0; }
.phase-dot-3 { background: #f0b840; }
.phase-dot-4 { background: #ff7060; }
.phase-dot-5 { background: #60a0f8; }
.phase-dot-6 { background: #c8f060; }

.badge-ph1 { background: rgba(157,127,255,0.15); color: #9d7fff; }
.badge-ph2 { background: rgba(64,224,176,0.15); color: #40e0b0; }
.badge-ph3 { background: rgba(240,184,64,0.15); color: #f0b840; }
.badge-ph4 { background: rgba(255,112,96,0.15); color: #ff7060; }
.badge-ph5 { background: rgba(96,160,248,0.15); color: #60a0f8; }
.badge-ph6 { background: rgba(200,240,96,0.15); color: #c8f060; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; }
  .main { margin-left: 0; }
  .day-grid { grid-template-columns: 1fr; }
  .phase-overview { grid-template-columns: 1fr 1fr; }
  .tips-grid { grid-template-columns: 1fr; }
  .content { padding: 20px; }
  .header { padding: 20px; }
}

.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 300;
}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">PrepTrack</div>
    <div class="logo-sub">SDE · 6-Month Plan</div>
  </div>
  <div class="sidebar-stats">
    <div class="stat-row">
      <div class="stat-item"><div class="stat-n" id="sb-solved">0</div><div class="stat-l">Solved</div></div>
      <div class="stat-item"><div class="stat-n" id="sb-total">0</div><div class="stat-l">Total</div></div>
      <div class="stat-item"><div class="stat-n" id="sb-days">0</div><div class="stat-l">Days Done</div></div>
    </div>
    <div class="overall-bar">
      <div class="bar-label"><span>Overall Progress</span><span id="sb-pct">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="sb-bar" style="width:0%"></div></div>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="header" id="main-header">
    <div class="header-top">
      <div>
        <div class="header-title" id="phase-title">Loading...</div>
        <div class="header-meta" id="phase-meta"></div>
      </div>
      <div class="phase-badge-lg" id="phase-badge"></div>
    </div>
    <div class="header-tabs">
      <button class="htab active" onclick="switchTab('problems')">Problems</button>
      <button class="htab" onclick="switchTab('overview')">Overview</button>
      <button class="htab" onclick="switchTab('tips')">Tips & Strategy</button>
    </div>
  </div>

  <div class="content">
    <div class="tab-panel active" id="tab-problems">
      <div id="weeks-container"></div>
    </div>
    <div class="tab-panel" id="tab-overview">
      <div id="overview-container"></div>
    </div>
    <div class="tab-panel" id="tab-tips">
      <div id="tips-container"></div>
    </div>
  </div>
</main>

</div>

<script>
const DATA = {
  phases: [
    {
      id: 1,
      title: "Foundation & Pattern Recognition",
      months: "Month 1",
      color: "ph1",
      badge: "badge-ph1",
      dot: "phase-dot-1",
      goal: "Solve any Easy in under 20 min. Recognize 5 patterns by sight.",
      focus: ["Arrays", "Strings", "Hashing", "Two Pointer", "Sliding Window"],
      daily: "1 Easy + 30 min theory",
      tips: [
        "Learn patterns, never memorize answers",
        "Write brute-force first, then optimize",
        "Always state time/space complexity",
        "Verbalize your approach before coding",
        "Friday = blind revision — no notes"
      ],
      strategy: "Your first month is about building the pattern-recognition reflex. Every problem you see should trigger a question: 'Which pattern does this map to?' Slow and deliberate beats fast and forgotten.",
      weeks: [
        {
          num: 1, title: "Two Pointer + Sliding Window",
          days: [
            { day: "Mon", topic: "Two Pointer — basics", problems: [
              { id: "1-1-1", name: "#125 · Valid Palindrome", diff: "easy", note: "left+right pointers moving inward" },
              { id: "1-1-2", name: "#167 · Two Sum II", diff: "easy", note: "sorted array, squeeze toward answer" }
            ], note: "Focus on pointer movement logic. Draw it out before coding." },
            { day: "Tue", topic: "Two Pointer — intermediate", problems: [
              { id: "1-1-3", name: "#15 · 3Sum", diff: "medium", note: "fix one, two-pointer the rest" },
              { id: "1-1-4", name: "#11 · Container With Most Water", diff: "medium", note: "greedy shrink from both ends" }
            ], note: "Why do we sort first in 3Sum? Think duplicates." },
            { day: "Wed", topic: "Sliding Window — fixed size", problems: [
              { id: "1-1-5", name: "#643 · Max Average Subarray I", diff: "easy", note: "fixed k window, slide and update" },
              { id: "1-1-6", name: "#1456 · Max Vowels in Substring of K", diff: "medium", note: "count-in count-out as window slides" }
            ], note: "Sliding window = avoiding recomputation. Feel the O(n) vs O(n²) difference." },
            { day: "Thu", topic: "Sliding Window — variable size", problems: [
              { id: "1-1-7", name: "#3 · Longest Substring Without Repeating", diff: "medium", note: "expand right, shrink left on violation" },
              { id: "1-1-8", name: "#424 · Longest Repeating Char Replacement", diff: "medium", note: "window valid if (len - maxFreq) ≤ k" }
            ], note: "Variable window: you decide WHEN to shrink. Define your invariant out loud." },
            { day: "Fri", topic: "Blind revision + bonus", problems: [
              { id: "1-1-9", name: "#76 · Minimum Window Substring", diff: "medium", note: "variable window + char frequency map" },
              { id: "1-1-10", name: "Re-solve 1 problem from Mon–Thu blind", diff: "theory", note: "No notes · timed · talk out loud" }
            ], note: "Friday rule: if you can't solve it from memory, you didn't learn it yet." },
            { day: "Sat", topic: "Theory + Review", problems: [
              { id: "1-1-11", name: "Review notes from the week", diff: "theory", note: "Identify patterns across all 10 problems" },
              { id: "1-1-12", name: "Write pattern cheat-sheet (2 Pointer + SW)", diff: "theory", note: "In your own words. No copy-paste." }
            ], note: "Rest or light review. No new problems." }
          ]
        },
        {
          num: 2, title: "HashMap + Hashing Patterns",
          days: [
            { day: "Mon", topic: "HashMap basics", problems: [
              { id: "1-2-1", name: "#1 · Two Sum", diff: "easy", note: "classic hashmap lookup" },
              { id: "1-2-2", name: "#242 · Valid Anagram", diff: "easy", note: "frequency count comparison" }
            ], note: "HashMap = trade space for time. Always." },
            { day: "Tue", topic: "Frequency counting", problems: [
              { id: "1-2-3", name: "#49 · Group Anagrams", diff: "medium", note: "sorted key → group into buckets" },
              { id: "1-2-4", name: "#347 · Top K Frequent Elements", diff: "medium", note: "freq map + bucket sort or heap" }
            ], note: "Bucket sort trick: index by frequency — O(n) instead of O(n log n)." },
            { day: "Wed", topic: "Prefix sum + HashMap", problems: [
              { id: "1-2-5", name: "#560 · Subarray Sum Equals K", diff: "medium", note: "prefix sum + hashmap count" },
              { id: "1-2-6", name: "#238 · Product of Array Except Self", diff: "medium", note: "prefix + suffix product, no division" }
            ], note: "Prefix sum is the hidden pattern behind many 'subarray' problems." },
            { day: "Thu", topic: "String + HashMap combos", problems: [
              { id: "1-2-7", name: "#128 · Longest Consecutive Sequence", diff: "medium", note: "HashSet, only start sequences" },
              { id: "1-2-8", name: "#383 · Ransom Note", diff: "easy", note: "char frequency subtraction" }
            ], note: "HashSet lookup is O(1). Use it aggressively." },
            { day: "Fri", topic: "Blind revision", problems: [
              { id: "1-2-9", name: "Re-solve #560 Subarray Sum Equals K", diff: "medium", note: "The prefix+hash combo trips everyone" },
              { id: "1-2-10", name: "Re-solve #347 Top K Frequent Elements", diff: "medium", note: "Try both heap and bucket sort approaches" }
            ], note: "Aim: 20 min per problem, no hints." },
            { day: "Sat", topic: "Review", problems: [
              { id: "1-2-11", name: "Update pattern cheat-sheet with HashMap patterns", diff: "theory", note: "" }
            ], note: "" }
          ]
        },
        {
          num: 3, title: "Linked Lists + Stack/Queue",
          days: [
            { day: "Mon", topic: "Linked List traversal", problems: [
              { id: "1-3-1", name: "#206 · Reverse Linked List", diff: "easy", note: "3-pointer reversal: prev, curr, next" },
              { id: "1-3-2", name: "#21 · Merge Two Sorted Lists", diff: "easy", note: "dummy head pattern" }
            ], note: "Always draw the pointer state before and after. Never code LL problems blind." },
            { day: "Tue", topic: "Fast & Slow pointers", problems: [
              { id: "1-3-3", name: "#141 · Linked List Cycle", diff: "easy", note: "Floyd's tortoise and hare" },
              { id: "1-3-4", name: "#143 · Reorder List", diff: "medium", note: "find middle + reverse + merge" }
            ], note: "Fast/slow = most LL medium problems. Master this." },
            { day: "Wed", topic: "Stack basics", problems: [
              { id: "1-3-5", name: "#20 · Valid Parentheses", diff: "easy", note: "push open, pop and match close" },
              { id: "1-3-6", name: "#155 · Min Stack", diff: "medium", note: "parallel min-tracking stack" }
            ], note: "Stack = last-in-first-out. Think about what 'recent' information you need." },
            { day: "Thu", topic: "Monotonic Stack", problems: [
              { id: "1-3-7", name: "#739 · Daily Temperatures", diff: "medium", note: "monotonic decreasing stack" },
              { id: "1-3-8", name: "#853 · Car Fleet", diff: "medium", note: "stack of speeds/times" }
            ], note: "Monotonic stack = O(n) solution for 'next greater element' type problems." },
            { day: "Fri", topic: "Blind revision", problems: [
              { id: "1-3-9", name: "Re-solve #143 Reorder List", diff: "medium", note: "Draw pointer diagrams first" },
              { id: "1-3-10", name: "Re-solve #739 Daily Temperatures", diff: "medium", note: "" }
            ], note: "" },
            { day: "Sat", topic: "Review", problems: [
              { id: "1-3-11", name: "Linked List + Stack cheat-sheet", diff: "theory", note: "Diagrams only. No code." }
            ], note: "" }
          ]
        },
        {
          num: 4, title: "Binary Search + Week Review",
          days: [
            { day: "Mon", topic: "Binary Search basics", problems: [
              { id: "1-4-1", name: "#704 · Binary Search", diff: "easy", note: "classic lo/hi/mid template" },

let state = {};
let currentPhase = 1;

function loadState() {
  try { state = JSON.parse(localStorage.getItem('preptrack_v1') || '{}'); } catch(e) { state = {}; }
}
function saveState() {
  try { localStorage.setItem('preptrack_v1', JSON.stringify(state)); } catch(e) {}
}

function getTotals() {
  let totalProbs = 0, solvedProbs = 0, daysDone = 0;
  DATA.phases.forEach(ph => {
    ph.weeks.forEach(wk => {
      wk.days.forEach(d => {
        let allDone = d.problems.length > 0;
        d.problems.forEach(p => {
          totalProbs++;
          if (state[p.id]) { solvedProbs++; } else { allDone = false; }
        });
        if (allDone && d.problems.length > 0) daysDone++;
      });
    });
  });
  return { totalProbs, solvedProbs, daysDone };
}

function getPhaseTotals(ph) {
  let total = 0, solved = 0;
  ph.weeks.forEach(wk => wk.days.forEach(d => d.problems.forEach(p => {
    total++; if (state[p.id]) solved++;
  })));
  return { total, solved };
}

function getWeekTotals(wk) {
  let total = 0, solved = 0;
  wk.days.forEach(d => d.problems.forEach(p => {
    total++; if (state[p.id]) solved++;
  }));
  return { total, solved };
}

function updateSidebar() {
  const { totalProbs, solvedProbs, daysDone } = getTotals();
  document.getElementById('sb-solved').textContent = solvedProbs;
  document.getElementById('sb-total').textContent = totalProbs;
  document.getElementById('sb-days').textContent = daysDone;
  const pct = totalProbs ? Math.round(solvedProbs / totalProbs * 100) : 0;
  document.getElementById('sb-pct').textContent = pct + '%';
  document.getElementById('sb-bar').style.width = pct + '%';

  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  DATA.phases.forEach(ph => {
    const { total, solved } = getPhaseTotals(ph);
    const pPct = total ? Math.round(solved / total * 100) : 0;
    const label = document.createElement('div');
    label.className = 'nav-phase-label';
    label.textContent = ph.months;
    nav.appendChild(label);
    const item = document.createElement('div');
    item.className = 'nav-item' + (ph.id === currentPhase ? ' active' : '');
    item.onclick = () => selectPhase(ph.id);
    item.innerHTML = `<span class="nav-dot ${ph.dot}"></span><span style="flex:1;font-size:12px">${ph.title.split(' ')[0] + ' ' + (ph.title.split(' ')[1] || '')}</span><span class="nav-pct">${pPct}%</span>`;
    nav.appendChild(item);
  });
}

function selectPhase(id) {
  currentPhase = id;
  renderPhase();
  updateSidebar();
  document.getElementById('tab-problems').parentElement && switchTab('problems');
}

function switchTab(name) {
  document.querySelectorAll('.htab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('tab-' + name);
  if (panel) panel.classList.add('active');
  const tabs = document.querySelectorAll('.htab');
  const map = { problems: 0, overview: 1, tips: 2 };
  if (tabs[map[name]]) tabs[map[name]].classList.add('active');
  if (name === 'overview') renderOverview();
  if (name === 'tips') renderTips();
}

function renderPhase() {
  const ph = DATA.phases.find(p => p.id === currentPhase);
  if (!ph) return;

  document.getElementById('phase-title').innerHTML = `<span>${ph.months}</span> — ${ph.title}`;
  document.getElementById('phase-meta').textContent = `Daily: ${ph.daily}`;
  const badge = document.getElementById('phase-badge');
  badge.textContent = ph.months;
  badge.className = 'phase-badge-lg ' + ph.badge;

  renderWeeks(ph);
  renderOverview(ph);
  renderTips(ph);
}

function renderWeeks(ph) {
  const container = document.getElementById('weeks-container');
  container.innerHTML = '';
  ph.weeks.forEach(wk => {
    const { total, solved } = getWeekTotals(wk);
    const pct = total ? Math.round(solved / total * 100) : 0;
    const sec = document.createElement('div');
    sec.className = 'week-section';
    sec.innerHTML = `<div class="week-heading">
      <span class="week-num">Week ${wk.num}</span>
      <span class="week-title">${wk.title}</span>
      <span class="week-line"></span>
      <span class="week-prog">${solved}/${total}</span>
    </div>`;
    const grid = document.createElement('div');
    grid.className = 'day-grid';
    wk.days.forEach(d => {
      grid.appendChild(buildDayCard(d, wk.num === (ph.weeks[0] ? ph.weeks[0].num : -1)));
    });
    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function buildDayCard(d, firstWeekNum) {
  const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const solved = d.problems.filter(p => state[p.id]).length;
  const total = d.problems.length;
  const pct = total ? Math.round(solved / total * 100) : 0;
  const card = document.createElement('div');
  card.className = 'day-card';
  card.id = 'card-' + d.problems[0]?.id;

  const isOpen = solved < total;

  let probsHtml = d.problems.map(p => {
    const checked = state[p.id] ? 'checked' : '';
    const textClass = state[p.id] ? 'prob-name checked-text' : 'prob-name';
    const diffClass = {easy:'diff-easy', medium:'diff-medium', hard:'diff-hard', theory:'diff-theory', mock:'diff-mock', blind:'diff-theory'}[p.diff] || 'diff-easy';
    const diffLabel = {easy:'Easy', medium:'Medium', hard:'Hard', theory:'Theory', mock:'Mock', blind:'Blind'}[p.diff] || p.diff;
    return `<div class="prob-item">
      <div class="checkbox ${checked}" id="cb-${p.id}" onclick="toggleProb('${p.id}')"></div>
      <div class="prob-details">
        <div class="${textClass}" id="pn-${p.id}">${p.name}</div>
        ${p.note ? `<div class="prob-sub">${p.note}</div>` : ''}
      </div>
      <span class="diff ${diffClass}">${diffLabel}</span>
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="day-mini-bar">
      <div class="mini-track"><div class="mini-fill" id="mf-${d.problems[0]?.id}" style="width:${pct}%"></div></div>
    </div>
    <div class="day-card-head" onclick="toggleCard('db-${d.problems[0]?.id}','exp-${d.problems[0]?.id}')">
      <span class="day-label">${d.day}</span>
      <span class="day-topic">${d.topic}</span>
      <span class="day-expand ${isOpen ? 'open' : ''}" id="exp-${d.problems[0]?.id}">▶</span>
    </div>
    <div class="day-card-body ${isOpen ? 'open' : ''}" id="db-${d.problems[0]?.id}">
      ${probsHtml}
      ${d.note ? `<div class="day-note">${d.note}</div>` : ''}
    </div>`;
  return card;
}

function toggleCard(bodyId, expId) {
  const body = document.getElementById(bodyId);
  const exp = document.getElementById(expId);
  if (!body) return;
  body.classList.toggle('open');
  if (exp) exp.classList.toggle('open');
}

function toggleProb(id) {
  state[id] = !state[id];
  saveState();
  const cb = document.getElementById('cb-' + id);
  const pn = document.getElementById('pn-' + id);
  if (cb) cb.className = 'checkbox' + (state[id] ? ' checked' : '');
  if (pn) pn.className = state[id] ? 'prob-name checked-text' : 'prob-name';
  updateMiniBar(id);
  updateSidebar();
}

function updateMiniBar(probId) {
  const ph = DATA.phases.find(p => p.id === currentPhase);
  if (!ph) return;
  for (const wk of ph.weeks) {
    for (const d of wk.days) {
      if (d.problems.find(p => p.id === probId)) {
        const solved = d.problems.filter(p => state[p.id]).length;
        const pct = d.problems.length ? Math.round(solved / d.problems.length * 100) : 0;
        const mf = document.getElementById('mf-' + d.problems[0]?.id);
        if (mf) mf.style.width = pct + '%';
        return;
      }
    }
  }
}

function renderOverview(ph) {
  if (!ph) ph = DATA.phases.find(p => p.id === currentPhase);
  const container = document.getElementById('overview-container');
  const { total, solved } = getPhaseTotals(ph);
  const pct = total ? Math.round(solved / total * 100) : 0;
  container.innerHTML = `
    <div class="phase-overview">
      <div class="phase-stat-card"><div class="psc-label">Problems solved</div><div class="psc-val">${solved}</div><div class="psc-sub">of ${total} total</div></div>
      <div class="phase-stat-card"><div class="psc-label">Completion</div><div class="psc-val">${pct}%</div><div class="psc-sub">this phase</div></div>
      <div class="phase-stat-card"><div class="psc-label">Daily target</div><div class="psc-val" style="font-size:14px;margin-top:6px">${ph.daily}</div><div class="psc-sub">&nbsp;</div></div>
    </div>
    <div class="phase-stat-card" style="margin-bottom:16px">
      <div class="psc-label">Phase goal</div>
      <div style="font-size:14px;color:var(--text);margin-top:8px;line-height:1.5">${ph.goal}</div>
    </div>
    <div class="phase-stat-card" style="margin-bottom:16px">
      <div class="psc-label">Topics this phase</div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${ph.focus.map(f => `<span style="background:var(--surface3);color:var(--muted);font-size:12px;padding:3px 10px;border-radius:4px;font-family:var(--font-mono)">${f}</span>`).join('')}</div>
    </div>
    <div class="phase-stat-card">
      <div class="psc-label">Strategy</div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6">${ph.strategy}</div>
    </div>
  `;
}

function renderTips(ph) {
  if (!ph) ph = DATA.phases.find(p => p.id === currentPhase);
  const container = document.getElementById('tips-container');
  container.innerHTML = `
    <div class="tips-grid">
      <div class="tip-card">
        <div class="tip-card-title">Interview tips for this phase</div>
        <ul class="tip-list">${ph.tips.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
      <div class="tip-card">
        <div class="tip-card-title">Golden rules (every phase)</div>
        <ul class="tip-list">
          <li>Always verbalize your approach before coding</li>
          <li>State time and space complexity unprompted</li>
          <li>Write brute-force first, then optimize</li>
          <li>Friday = blind revision. Non-negotiable.</li>
          <li>One problem understood &gt; three problems memorized</li>
          <li>If stuck after 20 min: get a hint, not the solution</li>
        </ul>
      </div>
    </div>
    <div class="phase-stat-card">
      <div class="psc-label">Phase strategy</div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6">${ph.strategy}</div>
    </div>
  `;
}

function init() {
  loadState();
  updateSidebar();
  renderPhase();
}

init();
</script>
</body>
</html>
